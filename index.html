<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Мәдени мұралар — математикалық ойын</title><style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#e7f7ff,#fff4c9,#fbe7fa);font-family:"Times New Roman",serif;color:#102b77}.wrap{max-width:1450px;margin:auto;padding:14px}h1{text-align:center;font-size:clamp(34px,5vw,66px);margin:8px;color:#0938a1;font-weight:900}.sub{text-align:center;font-size:clamp(20px,2.5vw,32px);font-weight:900;margin:5px 0 20px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.tile{min-width:0;border:5px solid #1889ee;border-radius:22px;background:white;overflow:hidden;box-shadow:0 6px 10px #144b8130;position:relative;min-height:310px}.photo{width:100%;height:100%;min-height:310px;object-fit:fill;display:block}.cover{width:100%;padding:0;border:0;display:block;cursor:pointer;background:white}.cover .photo{height:390px;width:calc(100% - 14px);margin:0 7px}.number{position:absolute;top:10px;right:10px;background:#ffe67b;border:3px solid #c58b18;border-radius:12px;padding:4px 12px;font:bold 30px 'Times New Roman';color:#153d9d}.quiz{padding:15px;display:flex;flex-direction:column;justify-content:center;min-height:390px;gap:12px}.question{font-size:clamp(24px,2.4vw,37px);font-weight:900;text-align:center}.choices{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}.choice{font:900 clamp(22px,2.2vw,32px) 'Times New Roman';background:#fff1a1;border:3px solid #1b78d3;border-radius:14px;color:#142f7e;padding:12px 15px;cursor:pointer;touch-action:manipulation}.choice:active{transform:scale(.96)}.feedback{text-align:center;font-size:27px;font-weight:bold;color:#b32837;min-height:35px}.done{position:relative}.done .photo{height:390px;width:calc(100% - 14px);margin:0 7px}.done .number{display:none}.footer{display:flex;align-items:center;justify-content:center;gap:15px;flex-wrap:wrap;margin:20px 0;font-size:27px;font-weight:900}.restart{font:bold 27px 'Times New Roman';border:0;border-radius:14px;background:#ffdc55;color:#102b77;padding:12px 25px;cursor:pointer}.win{text-align:center;color:#148048;font-size:clamp(25px,4vw,48px);font-weight:900;margin:15px}@media(max-width:700px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.tile{border-width:3px;border-radius:12px;min-height:165px}.cover .photo,.done .photo{height:180px;min-height:180px;width:calc(100% - 6px);margin:0 3px}.quiz{min-height:180px;padding:5px;gap:5px}.question{font-size:clamp(13px,3.2vw,20px)}.choice{font-size:clamp(12px,3vw,19px);padding:5px;border-width:2px;border-radius:8px}.choices{gap:3px}.feedback{font-size:15px;min-height:0}.number{font-size:17px;padding:2px 5px;top:3px;right:3px}.sub{font-size:20px}}
#fireworks{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9999}
</style></head><body><main class="wrap"><h1>МӘДЕНИ МҰРАЛАР</h1><div class="sub">Суретті бас → есепті шығар → мәдени мұраны аш!</div><section class="grid" id="grid"></section><div id="win" class="win"></div><div class="footer"><span id="count">Ашылған сурет: 0 / 9</span><button class="restart" onclick="restart()">↻ ҚАЙТА БАСТАУ</button></div></main><canvas id="fireworks" aria-hidden="true"></canvas><script>
const data=[["1 га = ? ар", ["10 ар", "100 ар", "1000 ар"], 1], ["V — жылдамдықты табу үшін не істейміз?", ["S : t", "S × t", "t : S"], 0], ["4³ = ?", ["16", "64", "12"], 1], ["S — қашықтықты табу үшін не істейміз?", ["v : t", "v × t", "v + t"], 1], ["Ұзындығы 8 см, ені 5 см. Фигураның ауданын тап.", ["40 см²", "26 см²", "13 см²"], 0], ["Ұзындығы 7 см, ені 3 см. Фигураның периметрін тап.", ["21 см", "10 см", "20 см"], 2], ["30 × 100 = ?", ["300", "3000", "30 000"], 1], ["1 сағаттың ширегі = ?", ["15 минут", "30 минут", "20 минут"], 0], ["Тәуліктің 1/6 бөлігі = ?", ["6 сағат", "4 сағат", "3 сағат"], 1]];const names=["Бекет ата жерасты мешіті", "Қожа Ахмет Ясауи кесенесі", "Айша бибі кесенесі", "Шерқала", "Шопан ата жерасты мешіті", "Бозжыра", "Отырар қалашығы", "Киіз үй", "Домбыра"];let states=Array(9).fill(0);let errors=Array(9).fill('');const grid=document.getElementById('grid');function render(){grid.innerHTML='';data.forEach((q,i)=>{let tile=document.createElement('article');tile.className='tile';if(states[i]===0){let btn=document.createElement('button');btn.className='cover';btn.setAttribute('aria-label',(i+1)+'-тапсырманы ашу');btn.innerHTML='<img class="photo" src="assets/heritage'+(i+1)+'.png" alt="'+names[i]+'"><span class="number">'+(i+1)+'</span>';btn.onclick=()=>{states[i]=1;render()};tile.append(btn)}else if(states[i]===1){let box=document.createElement('div');box.className='quiz';let h=document.createElement('div');h.className='question';h.textContent=(i+1)+'. '+q[0];box.append(h);let opts=document.createElement('div');opts.className='choices';q[1].forEach((option,j)=>{let b=document.createElement('button');b.className='choice';b.textContent=option;b.onclick=()=>{if(j===q[2]){states[i]=2;errors[i]='';render();celebrate()}else{errors[i]='Қайта ойланып көр!';render()}};opts.append(b)});box.append(opts);let fb=document.createElement('div');fb.className='feedback';fb.textContent=errors[i];box.append(fb);tile.append(box)}else{tile.className='tile done';let im=document.createElement('img');im.className='photo';im.src='assets/heritage'+(i+1)+'.png';im.alt=names[i];tile.append(im)}grid.append(tile)});let done=states.filter(s=>s===2).length;document.getElementById('count').textContent='Ашылған сурет: '+done+' / 9';document.getElementById('win').textContent=''}function restart(){states.fill(0);errors.fill('');render()}render();

let audioCtx;function playSuccess(){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();let now=audioCtx.currentTime;[523.25,659.25,783.99,1046.5,1318.5].forEach((hz,i)=>{let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=hz;o.connect(g);g.connect(audioCtx.destination);let t=now+i*.105;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.16,t+.025);g.gain.exponentialRampToValueAtTime(.0001,t+.34);o.start(t);o.stop(t+.36)})}catch(e){}}
let particles=[],animationRunning=false;const canvas=document.getElementById('fireworks'),ctx=canvas.getContext('2d');function resizeCanvas(){canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}window.addEventListener('resize',resizeCanvas);resizeCanvas();function celebrate(){playSuccess();for(let burst=0;burst<4;burst++){let x=innerWidth*(.18+Math.random()*.64),y=innerHeight*(.15+Math.random()*.5);for(let j=0;j<48;j++){let a=j*Math.PI*2/48,sp=2.5+Math.random()*5;particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:70,color:['#ff2d55','#ffd600','#00bfff','#4ade80','#a855f7','#ff8c00'][j%6]})}}if(!animationRunning){animationRunning=true;requestAnimationFrame(animateFireworks)}}function animateFireworks(){ctx.clearRect(0,0,innerWidth,innerHeight);particles=particles.filter(p=>p.life>0);particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.065;p.vx*=.99;p.life--;ctx.globalAlpha=Math.min(1,p.life/25);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,Math.max(1,p.life/22),0,Math.PI*2);ctx.fill()});ctx.globalAlpha=1;if(particles.length)requestAnimationFrame(animateFireworks);else animationRunning=false}
</script></body></html>
